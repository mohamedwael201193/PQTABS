name: ci

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.8.5
      - run: forge test
      - run: forge build --sizes

  signer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path signer/Cargo.toml

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run lint
        working-directory: backend

  sdk-and-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/package-lock.json
      - run: npm ci
      # The MCP imports pqtabs-sdk from its built dist/, so build the SDK before the MCP typecheck.
      - run: npm run build --workspace pqtabs-sdk
      - run: npm run lint --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci rejects this lockfile on Linux: the wasm32 optional packages (for example @img/sharp-wasm32) need
      # @emnapi/runtime and @emnapi/core, which npm does not record when the lockfile is generated on Windows.
      # npm install resolves those entries from the same lockfile. Fix the lockfile itself, then switch back to npm ci.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint:ratchet
      - run: npm test

  pqtabs-signer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/pqtabs-signer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/pqtabs-signer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          # Isolated key directory for the test run. runner.temp is not available at job level.
          PQTABS_SIGNER_DIR: ${{ runner.temp }}\pqtabs-signer-keys

  pins-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_pins.py
      - run: python scripts/secret_scan.py

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.8.5
      - run: pipx install slither-analyzer==0.11.6
      - run: slither . --filter-paths "lib/|test/|scripts/" --exclude incorrect-equality,reentrancy-no-eth --fail-high
