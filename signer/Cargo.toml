[package]
name = "pqtabs-sign"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = ["cli"]
cli = ["dep:clap", "dep:rpassword"]

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
clap = { version = "4.5.23", features = ["derive"], optional = true }
hex = "0.4.3"
rand = "0.10"
rpassword = { version = "7.3.1", optional = true }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
sha3 = "0.10.8"
slh-dsa = "=0.2.0-rc.5"

[[bin]]
name = "pqtabs-sign"
required-features = ["cli"]
